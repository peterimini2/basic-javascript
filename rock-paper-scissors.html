<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scisssors</title>
  <link rel="stylesheet" href="css/main.css">
  <script src="js/rock-paper-scissors.js" defer></script>
</head>
<body class="rock-paper">
  <p class="title">Rock Paper Scissors</p>
  <button id="rock"><img src="images/rock.png" alt="rock"></button>
  <button id="paper"><img src="images/paper.png" alt=""></button>
  <button id="scissors"><img src="images/scissors.png" alt=""></button>
  <p class="js-result"></p>
  <p class="js-moves"></p>
  <p class="js-score"></p>

  <button id="reset">Reset Score</button>
</body>
</html>
