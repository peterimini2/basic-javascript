<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scisssors</title>
  <link rel="stylesheet" href="css/main.css">
  <script src="js/rock-paper-scissors.js" defer></script>
</head>
<body class="rock-paper">
  <p class="title">Rock Paper Scissors</p>
  <button id="rock" class="move-button"><img src="images/rock.png" alt="rock" class="move-icon"></button>
  <button id="paper" class="move-button"><img src="images/paper.png" alt="paper" class="move-icon"></button>
  <button id="scissors" class="move-button"><img src="images/scissors.png" alt="scissors" class="move-icon"></button>
  <p class="js-result result">You Win</p>
  <p class="js-moves"></p>
  <p class="js-score score"></p>

  <button id="reset" class="reset-btn">Reset Score</button>
</body>
</html>
