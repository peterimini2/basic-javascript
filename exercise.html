<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise Page</title>
  <link rel="stylesheet" href="css/main.css">
  <script src="js/exercise.js" defer ></script>
</head>
<body>
  <input id="input" type="text" placeholder="Write your goals...">
  <button id="save">Save Goal</button>
  <button id="clear">Clear Goal</button>
  <p id="safe"></p>
  <br><br><br>

  <p>Check Result</p>
  <input type="number" placeholder="Input score..." class="score-text">
  <button class="check-btn">Check Result</button>
  <p id="scoreResult"></p>
  <br>

  <p>Check age</p>
  <input type="number" placeholder="Input age..." class="age-text">
  <button class="age-btn">Check Age</button>
  <p id="ageResult"></p>
  <br>

  <p>Check Positive/ Negative number</p>
  <input type="number" placeholder="Input number..." class="num-text">
  <button class="num-btn">Check Number</button>
  <p id="numResult"></p>
  <br><br>

  <p>Enter login details</p>
  <input type="text" placeholder="Username" class="username">
  <br><br>
  <input type="number" placeholder="Password" class="password">
  <br><br>
  <button class="login-btn">Login</button>
  <p id="loginResult"></p>
  <br><br>

  <p>Largest Number</p>
  <input type="number" placeholder="Enter number" class="large-num">
  <br><br>
  <input type="number" placeholder="Enter number" class="small-num">
  <br><br>
  <button class="check-num">Check</button>
  <p class="num-output"></p>

  <!-- Grading system -->
   <input type="number" placeholder="Enter exam score" id="exam-score">
   <button class="grade-btn">Check Grade</button>
   <p class="grade-score"></p>
</body>
</html>
